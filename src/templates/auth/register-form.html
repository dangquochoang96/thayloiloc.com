<div class="card auth-card">
    <h2 class="auth-title">Tạo tài khoản</h2>
    <form id="register-form" class="auth-form">
        <div class="form-group">
            <label for="name">Tên</label>
            <input type="text" id="name" name="name" required>
        </div>
        <div class="form-group">
            <label for="phone">Số điện thoại</label>
            <input type="tel" id="phone" name="phone" placeholder="Nhập 10 số điện thoại (VD: 0912345678)" maxlength="10" pattern="[0-9]{10}" required>
        </div>
        <div class="form-group">
            <label for="password">Mật khẩu</label>
            <input type="password" id="password" name="password" required>
        </div>

        <div class="form-group checkbox-group">
            <label class="checkbox-label">
                <input type="checkbox" id="register-technician" name="register_technician">
                <span>Đăng ký làm Kỹ Thuật Viên tại <strong style="color: #c77a2a;">Socbay</strong></span>
            </label>
        </div>

        <div id="technician-fields" style="display: none;">
            <div class="form-group">
                <label for="address">Nhập địa chỉ</label>
                <input type="text" id="address" name="address" placeholder="Vui lòng nhập địa chỉ">
            </div>

            <div class="form-group">
                <label for="birthday">Ngày sinh</label>
                <input type="date" id="birthday" name="birthday">
            </div>

            <div class="form-group">
                <label for="services">Dịch vụ cung cấp</label>
                <select id="services" name="services">
                    <option value="">Select</option>
                    <option value="3">Thay lõi lọc nước</option>
                    <option value="4">Sửa máy lọc nước</option>
                    <option value="5">Vệ sinh máy lọc nước</option>
                    <option value="6">Bảo dưỡng máy lọc nước</option>
                </select>
            </div>

            <div class="form-group">
                <label for="id_card_number">Số CCCD (12 số)</label>
                <input type="text" id="id_card_number" name="id_card_number" placeholder="Vui lòng nhập số căn cước" maxlength="12" pattern="[0-9]{12}">
            </div>

            <div class="form-group">
                <label>Hình ảnh thẻ căn cước</label>
                <div class="id-card-images">
                    <div class="image-upload-box">
                        <input type="file" id="id_card_front" name="id_card_front" accept="image/*" style="display: none;">
                        <label for="id_card_front" class="upload-label">
                            <div class="upload-placeholder">
                                <svg width="60" height="60" viewBox="0 0 24 24" fill="none" stroke="#ccc" stroke-width="2">
                                    <rect x="3" y="3" width="18" height="18" rx="2" ry="2"/>
                                    <circle cx="8.5" cy="8.5" r="1.5"/>
                                    <polyline points="21 15 16 10 5 21"/>
                                </svg>
                            </div>
                            <div class="edit-icon"><i class="fas fa-pen"></i></div>
                            <div class="image-label">Mặt trước</div>
                        </label>
                        <img id="preview_front" class="image-preview" style="display: none;">
                    </div>
                    <div class="image-upload-box">
                        <input type="file" id="id_card_back" name="id_card_back" accept="image/*" style="display: none;">
                        <label for="id_card_back" class="upload-label">
                            <div class="upload-placeholder">
                                <svg width="60" height="60" viewBox="0 0 24 24" fill="none" stroke="#ccc" stroke-width="2">
                                    <rect x="3" y="3" width="18" height="18" rx="2" ry="2"/>
                                    <circle cx="8.5" cy="8.5" r="1.5"/>
                                    <polyline points="21 15 16 10 5 21"/>
                                </svg>
                            </div>
                            <div class="edit-icon"><i class="fas fa-pen"></i></div>
                            <div class="image-label">Mặt sau</div>
                        </label>
                        <img id="preview_back" class="image-preview" style="display: none;">
                    </div>
                </div>
            </div>
        </div>

        <div id="error-msg" class="message message-error" style="display: none;"></div>
        <div id="success-msg" class="message message-success" style="display: none;">Đăng ký thành công...</div>

        <button type="submit" class="btn btn-primary btn-submit">
            <span class="btn-text">Đăng ký</span>
            <span class="spinner"></span>
        </button>

        <p class="auth-footer">
            Bạn đã có tài khoản ? <a href="#/login" class="auth-link">Đăng nhập</a>
        </p>
    </form>
</div>
