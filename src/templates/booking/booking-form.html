<form id="booking-form" class="card booking-form">
    <div class="form-container">
        <!-- Loại dịch vụ -->
        <div class="form-group">
            <label for="type_task">Loại Dịch Vụ <span class="required">*</span></label>
            <select id="type_task" name="type_task" required>
                <option value="">-- Chọn loại dịch vụ --</option>
                <option value="1">[VS Bảo dưỡng]</option>
                <option value="2">[Thay lõi + VS]</option>
                <option value="3">[Sửa máy + VS]</option>
                <option value="4">[Lắp máy]</option>
                <option value="5">[Chuyển máy]</option>
                <option value="6">Khác</option>
            </select>
        </div>

        <!-- Tên dịch vụ (hiển thị khi chọn 'Khác') -->
        <div class="form-group" id="service-name-group" style="display: none;">
            <label for="service_name">Tên Dịch Vụ <span class="required">*</span></label>
            <input type="text" id="service_name" name="service_name" placeholder="Nhập tên dịch vụ bạn muốn đặt lịch"
                autocomplete="off">
        </div>

        <!-- Sản phẩm -->
        <div class="form-group">
            <label for="product_id">Sản Phẩm </label>
            <select id="product_id" name="product_id">
                <option value="">Đang tải...</option>
            </select>
        </div>

        <!-- Vị trí máy (hiển thị sau khi chọn sản phẩm) -->
        <div id="product-location-info" class="product-location-info" style="display: none;">
            <!-- Content will be dynamically inserted here -->
        </div>

        <!-- Địa chỉ -->
        <div class="form-group">
            <label for="address">Địa Chỉ <span class="required">*</span></label>
            <input type="text" id="address" name="address" required placeholder="Nhập địa chỉ của bạn">
        </div>

        <!-- Chọn thợ yêu thích -->
        <div class="form-group staff-selection-group">
            <label for="staff" class="staff-group-title">
                <i class="fas fa-user-shield" style="color: #f97316;"></i> Chọn Thợ Yêu Thích
            </label>
            <select id="staff" name="staff" style="display: none;">
                <option value="">-- Không chọn (hệ thống sẽ tự động phân công) --</option>
            </select>
            <!-- Visual Cards Container -->
            <div id="staff-cards-container" class="staff-cards-container">
                <!-- Dynamically rendered technician cards -->
            </div>
            <p class="form-hint"><i class="fas fa-info-circle"></i> Bạn có thể chọn thợ yêu thích hoặc để hệ thống tự động phân công thợ gần nhất</p>
            <div id="staff-info" class="staff-info" style="display: none;">
                <span class="staff-info-name"><i class="fas fa-user-cog"></i> <span id="staff-info-name"></span></span>
                <span class="staff-info-phone"><i class="fas fa-phone"></i> <span id="staff-info-phone"></span></span>
            </div>
        </div>

        <!-- Thời gian bắt đầu -->
        <div class="form-group">
            <label for="time_start">Thời Gian Bắt Đầu <span class="required">*</span></label>
            <input type="datetime-local" id="time_start" name="time_start" required>
        </div>

        <!-- Mô tả -->
        <div class="form-group">
            <label for="des">Mô Tả</label>
            <textarea id="des" name="des" rows="4"
                placeholder="Mô tả chi tiết vấn đề hoặc yêu cầu của bạn..."></textarea>
        </div>

        <!-- Upload ảnh -->
        <div class="form-group">
            <label for="images">Hình Ảnh</label>
            <div class="image-upload-container" onclick="document.getElementById('images').click()">
                <i class="fas fa-cloud-upload-alt" style="font-size:2rem; color:#f97316; margin-bottom:8px;"></i>
                <p style="margin:0; color:#555; font-size:0.95rem;">Kéo thả hoặc <strong style="color:#f97316;">bấm để chọn ảnh</strong></p>
                <p class="form-hint" style="margin-top:6px;">Tối đa 4 ảnh • JPG, PNG, WEBP</p>
            </div>
            <input type="file" id="images" name="images" multiple accept="image/*" style="display:none;">
            <div id="image-preview" class="image-preview"></div>
        </div>

        <!-- Error/Success Messages -->
        <div id="error-msg" class="message message-error" style="display: none;"></div>
        <div id="success-msg" class="message message-success" style="display: none;"></div>

        <!-- Submit Button -->
        <button type="submit" class="btn btn-primary btn-submit">
            Xác Nhận Đặt Lịch
        </button>
    </div>
</form>
