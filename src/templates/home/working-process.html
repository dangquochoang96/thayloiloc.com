<section class="working-process-section">
  <div class="container">
    <h2 class="process-section-title">
      Quy trình làm việc <span class="highlight-text">"CHUYÊN NGHIỆP"</span>
    </h2>
    
    <div class="process-steps-wrapper">
      <!-- Yellow/Orange horizontal connecting bar -->
      <div class="process-connecting-line"></div>

      <div class="process-steps-grid">
        <!-- Step 1 -->
        <div class="process-step-card">
          <div class="step-icon-box">
            <svg class="step-svg-icon" viewBox="0 0 100 80" width="90" height="75">
              <!-- Air conditioner -->
              <rect x="15" y="10" width="70" height="22" rx="4" fill="#e2e8f0" stroke="#94a3b8" stroke-width="2"/>
              <line x1="20" y1="24" x2="80" y2="24" stroke="#cbd5e1" stroke-width="2"/>
              <rect x="70" y="14" width="8" height="4" rx="1" fill="#f97316"/>
              <!-- Toolbox -->
              <rect x="25" y="42" width="50" height="30" rx="5" fill="#f97316"/>
              <rect x="22" y="38" width="56" height="7" rx="3" fill="#ea580c"/>
              <path d="M42 38 V33 C42 31 44 29 47 29 H53 C56 29 58 31 58 33 V38" fill="none" stroke="#c2410c" stroke-width="3"/>
              <!-- Crossed tools badge -->
              <circle cx="50" cy="57" r="11" fill="#ea580c"/>
              <path d="M44 51 L56 63 M56 51 L44 63" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round"/>
            </svg>
          </div>
          <h3 class="step-title">Chọn dịch vụ</h3>
          <p class="step-desc">Chọn dịch vụ bạn cần sửa chữa hoặc bảo dưỡng</p>
          <div class="step-number-badge">1</div>
        </div>

        <!-- Step 2 -->
        <div class="process-step-card">
          <div class="step-icon-box">
            <svg class="step-svg-icon" viewBox="0 0 100 80" width="90" height="75">
              <!-- Calendar -->
              <rect x="20" y="12" width="48" height="44" rx="6" fill="#ffffff" stroke="#f97316" stroke-width="2.5"/>
              <path d="M20 12 H68 V24 H20 Z" fill="#f97316"/>
              <rect x="30" y="6" width="4" height="10" rx="2" fill="#ea580c"/>
              <rect x="54" y="6" width="4" height="10" rx="2" fill="#ea580c"/>
              <!-- Checkmark in calendar -->
              <path d="M33 38 L42 46 L57 30" fill="none" stroke="#22c55e" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
              <!-- Notification badge -->
              <circle cx="68" cy="18" r="8" fill="#ef4444"/>
              <text x="68" y="22" font-size="10" fill="#ffffff" font-weight="bold" text-anchor="middle">1</text>
              <!-- Phone outline -->
              <rect x="48" y="28" width="38" height="46" rx="7" fill="#ea580c"/>
              <rect x="52" y="32" width="30" height="34" rx="3" fill="#ffffff"/>
              <circle cx="67" cy="70" r="2" fill="#ffffff"/>
              <!-- Small check inside phone -->
              <path d="M60 46 L65 52 L74 41" fill="none" stroke="#f97316" stroke-width="3" stroke-linecap="round"/>
            </svg>
          </div>
          <h3 class="step-title">Đặt lịch</h3>
          <p class="step-desc">Đặt lịch hẹn tiện lợi qua App hoặc Website</p>
          <div class="step-number-badge">2</div>
        </div>

        <!-- Step 3 -->
        <div class="process-step-card">
          <div class="step-icon-box">
            <svg class="step-svg-icon" viewBox="0 0 100 80" width="90" height="75">
              <!-- Service Van & House -->
              <path d="M15 45 H45 V28 H25 L15 35 Z" fill="#f97316"/>
              <rect x="10" y="35" width="45" height="22" rx="3" fill="#ea580c"/>
              <circle cx="22" cy="57" r="6" fill="#1e293b"/>
              <circle cx="22" cy="57" r="2.5" fill="#94a3b8"/>
              <circle cx="45" cy="57" r="6" fill="#1e293b"/>
              <circle cx="45" cy="57" r="2.5" fill="#94a3b8"/>
              <!-- House outline back -->
              <polygon points="65,22 85,38 85,55 45,55 45,38" fill="#e2e8f0" stroke="#94a3b8" stroke-width="2"/>
              <polygon points="65,18 90,38 85,38 65,22" fill="#ef4444"/>
              <circle cx="65" cy="14" r="5" fill="#f59e0b"/>
              <!-- Technician character -->
              <circle cx="70" cy="36" r="8" fill="#ffedd5"/>
              <path d="M62 30 C62 26 78 26 78 30 H62 Z" fill="#ea580c"/>
              <rect x="63" y="44" width="14" height="15" rx="3" fill="#ea580c"/>
            </svg>
          </div>
          <h3 class="step-title">Thợ đến nhà</h3>
          <p class="step-desc">Kỹ thuật viên đến tận nơi để thực hiện dịch vụ</p>
          <div class="step-number-badge">3</div>
        </div>

        <!-- Step 4 -->
        <div class="process-step-card">
          <div class="step-icon-box">
            <svg class="step-svg-icon" viewBox="0 0 100 80" width="90" height="75">
              <!-- Clipboard / Phone with 5 stars -->
              <rect x="25" y="15" width="45" height="58" rx="6" fill="#ffffff" stroke="#f97316" stroke-width="2.5"/>
              <rect x="35" y="10" width="25" height="8" rx="3" fill="#f97316"/>
              <!-- 5 Stars -->
              <g fill="#f59e0b">
                <polygon points="33,26 34.5,29 38,29 35,31 36,34 33,32 30,34 31,31 28,29 31.5,29" transform="scale(0.8) translate(5, 5)"/>
                <polygon points="43,26 44.5,29 48,29 45,31 46,34 43,32 40,34 41,31 38,29 41.5,29" transform="scale(0.8) translate(10, 5)"/>
                <polygon points="53,26 54.5,29 58,29 55,31 56,34 53,32 50,34 51,31 48,29 51.5,29" transform="scale(0.8) translate(15, 5)"/>
                <polygon points="63,26 64.5,29 68,29 65,31 66,34 63,32 60,34 61,31 58,29 61.5,29" transform="scale(0.8) translate(20, 5)"/>
                <polygon points="73,26 74.5,29 78,29 75,31 76,34 73,32 70,34 71,31 68,29 71.5,29" transform="scale(0.8) translate(25, 5)"/>
              </g>
              <!-- Technician thumbs up avatar -->
              <circle cx="47" cy="45" r="9" fill="#ffedd5"/>
              <path d="M40 40 C40 37 54 37 54 40 Z" fill="#ea580c"/>
              <!-- Check badge -->
              <circle cx="58" cy="58" r="10" fill="#ea580c"/>
              <path d="M52 58 L56 62 L64 53" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
          </div>
          <h3 class="step-title">Hoàn tất và bảo hành</h3>
          <p class="step-desc">Hoàn tất dịch vụ, bảo hành điện tử tiện lợi</p>
          <div class="step-number-badge">4</div>
        </div>
      </div>
    </div>
  </div>
</section>
